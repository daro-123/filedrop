[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filedrop"
version = "0.1.0"
description = "Drag local files into desktop applications"
requires-python = ">=3.10"

[project.scripts]
filedrop = "filedrop:main"

[tool.setuptools]
py-modules = ["filedrop"]
